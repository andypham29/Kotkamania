<script src="{{url_for('static', filename='cookiehandler.js')}}"></script>
<script>
    // normal jinja syntax that js does not accept
    // pagination = {{pagination}}
 
    function saveProspectIdInCookie(id, name, avg_rank) {
        var cookies = getCookie('prospects')
        var json = {}

        var inner = {}
        inner["id"] = id
        inner["avg_rank"] = avg_rank
        inner["name"] = name
        
        var newProspects = (cookies == "") ? [] : JSON.parse(cookies).prospects
        var position = newProspects.findIndex(obj => {
            return obj.id === id
        })
        if ( position == -1  ) newProspects.push(inner)

        json["prospects"] = newProspects
        setCookie("prospects", JSON.stringify(json))
        getProspectPage()
    }

    function removeProspectIdInCookie(id) {
        var cookies = getCookie('prospects')
        var json = {}
        var newProspects = (cookies == "") ? [] : JSON.parse(cookies).prospects
        var position = newProspects.findIndex(obj => {
            return obj.id === id
        })
        if ( position != -1  ) newProspects.splice(position, 1)
        
        json["prospects"] = newProspects
        setCookie("prospects", JSON.stringify(json))
        getProspectPage()
    }

    function getProspectPage(position=null) {
        var trHTMLWatchList = "<tr>" +
                "<th>Rank</th>" +
                "<th>Average Rank</th>" +
                "<th>Player</th>" +
                "<th></th>" +
                "</tr>";
        prospects = getProspectsInCookie()
        if(prospects.length > 0) {
            var j = 0

            for(j=0; j < prospects.length; j++) {
                trHTMLWatchList += "<tr>" +
                `<td>${j+1}</td>` +
                `<td>${ JSON.stringify(prospects[j].avg_rank).replace(/[\"]/g, "")}</td>` +
                `<td><a href=\"/prospects/${ JSON.stringify(prospects[j].id) }\">${ JSON.stringify(prospects[j].name).replace(/[\"]/g, "") }</a></td>` +
                `<td><button onclick=removeProspectIdInCookie(${ JSON.stringify(prospects[j].id) })>-</button></td>` +
                "</tr>" 
            }
        }
        $.ajax({
            url: `/api/prospects`,
            crossDomain: true,
            dataType: "json",
            error: function(response) {
                alert(JSON.stringify(response))
            },
            success: function(response) {
                var trHTML = "<tr>" +
                "<th></th>" +
                "<th>Average Rank</th>" +
                "<th>Player</th>" +
                "<th>Position</th>" +
                "<th>League</th>" +
                "<th>Team</th>" +
                "<th>GP</th>" +
                "<th>G</th>" +
                "<th>A</th>" +
                "<th>P</th>" +
                "<th>PIM</th>" +
                "<th></th>" +
                "</tr>";

                var i = 0
                // sort response by ascending avg_rank
                response.sort(function(a, b) {
                    return (a.avg_rank===null)-(b.avg_rank===null) || +(a.avg_rank>b.avg_rank)||-(a.avg_rank<b.avg_rank);
                })
                $.each(response, function (i, prospect)
                {   
                    trHTML += "<tr>" +
                    `<td>${ ++i }</td>` +
                    `<td>${ prospect.avg_rank }</td>` +
                    `<td><a href=\"/prospects/${prospect.id}\">${ prospect.name }</a></td>` +
                    `<td>${ prospect.position }</td>` +
                    `<td>${ prospect.league }</td>` +
                    `<td>${ prospect.team }</td>` +
                    `<td>${ prospect.gp }</td>` +
                    `<td>${ prospect.g }</td>` +
                    `<td>${ prospect.a }</td>` +
                    `<td>${ prospect.p }</td>` +
                    `<td>${ prospect.pim }</td>` +
                    `<td><button onclick='saveProspectIdInCookie(${prospect.id},\"` + prospect.name + `\", \"` + prospect.avg_rank + `\")'>+</button></td>` +
                    "</tr>"       
                    
                });

                $('table#draft_table tbody').html(trHTML)
                $('table#watch_list tbody').html(trHTMLWatchList)

                $(".loader").remove();
               
            },
            type: 'GET'
        });
    }
    $(document).ready(getProspectPage());
</script>

        <tbody>
        </tbody>
    </table>
</div>
