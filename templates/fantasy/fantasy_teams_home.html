{% include 'fantasy/_fantasy_team_card.html' %}

<div class="ft-home-grid">
    <div class="row" id="fantasy-teams-grid">
        <div class="col-12 text-muted py-4 text-center">Loading teams…</div>
    </div>
</div>

<script>
    (function () {
        const $grid = $("#fantasy-teams-grid");
        $.ajax({
            url: "/api/nhl/fantasy/teams",
            dataType: "json",
            error: function () {
                $grid.html('<div class="col-12 text-danger py-4 text-center">Could not load teams.</div>');
            },
            success: function (teams) {
                if (!teams || !teams.length) {
                    $grid.html('<div class="col-12 text-muted py-4 text-center">No teams found.</div>');
                    return;
                }
                const html = teams.map(function (team) {
                    return '<div class="col-12 col-sm-6 col-lg-4 col-xl-3 ft-home-col">' +
                        renderFantasyTeamCard(team) +
                        "</div>";
                }).join("");
                $grid.html(html);
            },
            type: "GET"
        });
    })();
</script>
