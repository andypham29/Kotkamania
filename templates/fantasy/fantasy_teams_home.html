{% include 'fantasy/_fantasy_team_card.html' %}

<div class="ft-home-grid">
    <div id="fantasy-teams-grid">
        <div class="text-muted py-4 text-center">Loading teams…</div>
    </div>
</div>

<script>
    (function () {
        const $grid = $("#fantasy-teams-grid");
        const cols = ftNhlColumns();
        let teams = [];
        let sortKey = "points";
        let sortDesc = true;

        function teamName(team) {
            const nhl = team && team.nhl;
            return (nhl && nhl.fullName) || (team && team.abbreviation) || "Team";
        }

        function nhlSortValue(nhl, key) {
            if (!nhl) return null;
            const n = Number(nhl[key]);
            return isFinite(n) ? n : null;
        }

        function compareTeams(a, b) {
            if (sortKey === "team") {
                const cmp = teamName(a).localeCompare(teamName(b), undefined, { sensitivity: "base" });
                return sortDesc ? -cmp : cmp;
            }
            const av = nhlSortValue(a.nhl, sortKey);
            const bv = nhlSortValue(b.nhl, sortKey);
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (av === bv) return 0;
            return sortDesc ? bv - av : av - bv;
        }

        function sortMark(key) {
            if (sortKey !== key) return "";
            return sortDesc ? " desc" : " asc";
        }

        function renderTable() {
            const sorted = teams.slice().sort(compareTeams);
            const head = '<th class="ft-team-col' + sortMark("team") + '" data-sort-key="team">Team</th>' +
                cols.map(function (col) {
                    return '<th class="' + sortMark(col.key).trim() + '" data-sort-key="' + ftEscape(col.key) + '">' +
                        ftEscape(col.label) + "</th>";
                }).join("");
            const rows = sorted.map(function (team) {
                const nhl = team.nhl || {};
                const name = teamName(team);
                const logo = nhl.logoUrl
                    ? '<img class="ft-table-logo" src="' + ftEscape(nhl.logoUrl) + '" alt="">'
                    : "";
                const cells = cols.map(function (col) {
                    return "<td>" + ftEscape(ftFormatNhlStat(nhl, col)) + "</td>";
                }).join("");
                return '<tr>' +
                    '<td class="ft-team-col">' +
                    '<button type="button" class="btn btn-link btn-sm p-0 ft-team-open" data-team-id="' +
                    ftEscape(team.teamId) + '">' + logo + '<span>' + ftEscape(name) + "</span></button>" +
                    "</td>" + cells + "</tr>";
            }).join("");
            $grid.html(
                '<div class="ft-home-table-wrap">' +
                '<table class="table table-sm table-hover mb-0 ft-home-table">' +
                "<thead><tr>" + head + "</tr></thead>" +
                "<tbody>" + rows + "</tbody>" +
                "</table></div>"
            );
        }

        $grid.on("click", ".ft-team-open", function () {
            loadTeamModal($(this).data("teamId"));
        });

        $grid.on("click", "th[data-sort-key]", function () {
            const key = $(this).data("sortKey");
            if (sortKey === key) {
                sortDesc = !sortDesc;
            } else {
                sortKey = key;
                sortDesc = key !== "team";
            }
            renderTable();
        });

        $.ajax({
            url: "/api/nhl/fantasy/teams",
            dataType: "json",
            error: function () {
                $grid.html('<div class="text-danger py-4 text-center">Could not load teams.</div>');
            },
            success: function (payload) {
                if (!payload || !payload.length) {
                    $grid.html('<div class="text-muted py-4 text-center">No teams found.</div>');
                    return;
                }
                teams = payload;
                renderTable();
            },
            type: "GET"
        });
    })();
</script>
