<script>
    function loadPlayerModal(playerId) {
        $('table#player_info_table tbody').html("")
        $('h5#player_name').html("")
        $('table#player_stat_table tbody').html("")
        getPlayerStats(playerId)
    }

    function getPlayerStats(playerId) {
            $.ajax({
            url: `/api/nhl/players/${playerId}`,
            crossDomain: true,
            dataType: "json",
            error: function(response) {
                console.log(JSON.stringify(response))
            },
            success: function(response) {
                player = response
                getPlayerGameLog(player.playerId, player.position)
                getSchedule(player.teamId)

                playerNameString = `<a href=\"/nhl/players/${player.playerId}\">${ player.fullName }</a>`
                var trHTML = "<tr>" +
                "<th colspan=\"2\">Team</th>" +
                `<th colspan=\"2\">${ player.team }</th>` +
                "</tr>";

                trHTML += "<tr>" +
                "<td>Date of Birth</td>" +
                `<td>${ player.birthDate }</td>` +
                "<td>Position</td>" +
                `<td>${ player.position }</td>` +
                "</tr>" +
                "<tr>" +
                "<td>Age</td>" +
                `<td>${ player.currentAge }</td>` +
                "<td>Height</td>" +
                `<td>${ player.height }</td>` +
                "</tr>" +
                "<tr>" +
                "<td>City</td>" +
                `<td>${ player.birthCity }</td>` +
                "<td>Weight</td>" +
                `<td>${ player.weight }</td>` +
                "</tr>" +
                "<tr>" +
                "<td>Country</td>" +
                `<td>${ player.birthCountry }</td>` +
                "<td>Shoots</td>" +
                `<td>${ player.shootCatches }</td>` +
                "</tr>"

                var badge = player.badge
                console.log(player)
                getPlayerBadgeRadar([badge.scoring, badge.playmaking, badge.defense, badge.powerplay, badge.intangibles])

                var stats = ""
                if(player.stats[0] !== undefined){
                if(!(player.position).localeCompare('G')) {
                        var goalieStats = "<tr>" +
                        "<th></th><td>GP</td><td>GAA</td><td>SV%</td><td>WIN</td><td>LOSE</td><td>SO</td>" +
                        "</tr>"

                        player.stats.forEach(function(item){
                            goalieStats += "<tr>" +
                            `<td>${item.season}</td>` +
                            `<td>${nullish(item.stat.games)}</td>` +
                            `<td>${nullish(item.stat.goalAgainstAverage)}</td>` +
                            `<td>${nullish(item.stat.savePercentage)}</td>` +
                            `<td>${nullish(item.stat.wins)}</td>` +
                            `<td>${nullish(item.stat.losses)}</td>` +
                            `<td>${nullish(item.stat.shutouts)}</td>` +
                            "</tr>"
                        })

                        stats = goalieStats
                    }
                    else {
                        var playerStats = "<tr>" +
                        "<th></th><th>GP</th><th>G</th><th>A</th><th>TP</th><th>PIM</th><th>+/-</th>" +
                        "<th>PPG</th><th>PPP</th>" +
                        "<th>TOI</th><th>ETOI</th><th>SHTOI</th>" +
                        "<th>PPTOI</th>" +
                        "<th>SHOTS</th><th>HITS</th><th>BLKS</th>" +
                        "</tr>"
                        player.stats.forEach(function(item){
                            playerStats += `<tr><td>${item.season}</td>` +
                            `<td>${nullish(item.stat.games)}</td>` +
                            `<td>${nullish(item.stat.goals)}</td>` +
                            `<td>${nullish(item.stat.assists)}</td>` +
                            `<td>${nullish(item.stat.points)}</td>` +
                            `<td>${nullish(item.stat.penaltyMinutes)}</td>` +
                            `<td>${nullish(item.stat.plusMinus)}</td>` +
                            `<td>${nullish(item.stat.powerPlayGoals)}</td>` +
<!--                            `<td>${item.stat.powerPlayPoints - item.stat.powerPlayGoals}</td>` +-->
                            `<td>${nullish(item.stat.powerPlayPoints)}</td>` +
                            `<td>${nullish(timeFromSeconds(item.stat.timeOnIcePerGame))}</td>` +
                            `<td>${nullish(timeFromSeconds(item.stat.evenTimeOnIcePerGame))}</td>` +
                            `<td>${nullish(timeFromSeconds(item.stat.shortHandedTimeOnIcePerGame))}</td>` +
                            `<td>${nullish(timeFromSeconds(item.stat.powerPlayTimeOnIcePerGame))}</td>` +
                            `<td>${nullish(item.stat.shots)}</td>` +
                            `<td>${nullish(item.stat.hits)}</td>` +
                            `<td>${nullish(item.stat.blocked)}</td>` +
                            "</tr>"
                        })

                        stats = playerStats
                    }
                }

                var compare_button = `<td><button type="button" data-dismiss="modal" data-toggle="modal" data-target="#player-compare-modal" onclick="loadPlayerCompareModal(${player.playerId})" class="btn btn-outline-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">
                      <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                      <path fill-rule="evenodd" d="M5.216 14A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216z"/>
                      <path d="M4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                    </svg>
                    COMPARE
                    </button></td>` +
                    `<td>
                    </td>`


                $('table#player_info_table tbody').html(trHTML)
                $('h5#player_name').html(playerNameString)
                $('table#player_stat_table tbody').html(stats)

                $('div#compare_player').html(compare_button)

            },
            type: 'GET'
        });
    }

</script>
{% include 'nhl/player/nhl_player_compare_modal.html' %}
<div class="modal fade" id="player-modal" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content" style="overflow-y:auto;">
            <div class="modal-header">
                <h5 class="modal-title" id="player_name"></h5>
            </div>
            <div class="modal-body">
                <div class="container-fluid" style="overflow-x:auto;">
                    <table class="table table-sm" id="player_info_table">
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div id="compare_player"></div>
                <br>
                <div class="container-fluid" style="overflow-x:auto;">
                    <h5 class="async">Player Stats</h5>
                    <table class="table table-sm table-hover" id="player_stat_table">
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <br/>
                <div class="container-fluid" style="overflow-x:auto; overflow-y:auto;">
                    {% include 'nhl/player/nhl_player_badge.html' %}
                    {% include 'nhl/schedule/nhl_player_schedule.html' %}
                    {% include 'nhl/player/nhl_player_game_log.html' %}
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-dismiss="modal" type="button">Close</button>
            </div>
        </div>

    </div>
</div>
