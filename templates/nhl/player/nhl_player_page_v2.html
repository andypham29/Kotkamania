<script>
    (function () {
        "use strict";

        const load = () => {
            const tbody = document.getElementById("fpTableBody");
            tbody.innerHTML = `<tr><td colspan="15" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="text-muted mt-2">Loading players…</div>
            </td></tr>`;

            $.ajax({
                url: `/api/nhl/players/${playerId}`,
                crossDomain: true,
                dataType: "json",
                type: "GET",
                success: (resp) => {
                    state.all = Array.isArray(resp) ? resp : [];
                    renderTable();
                },
                error: (xhr) => {
                    tbody.innerHTML = `<tr><td colspan="15" class="text-center text-danger py-5">Failed to load players. (${xhr.status})</td></tr>`;
                }
            });
        }
    })();
</script>
